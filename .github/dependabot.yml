version: 2
updates:
  # Keeps the SHA-pinned actions (and their version comments) current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      # Named explicitly: they live in the `dev` extra, which Dependabot's
      # dependency-type filter doesn't recognise as development for uv.
      dev-tools:
        patterns:
          - mypy
          - pytest
          - pytest-asyncio
          - respx
          - ruff
