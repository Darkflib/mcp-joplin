name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # requires-python is >=3.12; test the floor and the newest we run locally.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml.
      - name: Install
        run: uv sync --locked --all-extras

      - name: Ruff (lint)
        run: uv run --no-sync ruff check --output-format=github .

      - name: Ruff (format)
        run: uv run --no-sync ruff format --check .

      - name: Mypy
        run: uv run --no-sync mypy src tests

      - name: Pytest
        run: uv run --no-sync pytest -q
